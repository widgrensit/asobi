name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # Manual re-run. CI here only triggers on push and pull_request, so when a
  # run is lost - a cancelled job, an Actions incident draining a backlog -
  # there is no way to ask for another against main without pushing to it,
  # which the PR-only workflow forbids. During the 2026-08-06 Actions outage
  # main sat with no completed CI run for hours for exactly this reason.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.2.3
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      # version-file drives the analysis jobs; the eunit/ct matrix uses
      # otp-matrix (else it falls back to the otp-version default of 28).
      otp-matrix: '["29.0.2"]'
      enable-audit: true
      enable-ct: true
      enable-coverage: true
      enable-elp-lint: true
      enable-elp-eqwalize: true
      # Diff-scoped, NOT a full-tree gate. `all` would fail on merge day: this
      # tree carries ~390 eqwalizer errors (asobi#435). `diff` fails only on
      # errors in modules a PR touches, so new code is type-checked from today
      # while the backlog is worked down behind it.
      #
      # The ordering matters. With the job off entirely the count drifts and
      # nothing says so: 312 on 2026-08-11, 391 on 2026-08-23, +79 in twelve
      # days while a cleanup was being planned against the 312 figure. A
      # cleanup that runs uncovered loses ground while it runs.
      #
      # This does mean a PR touching a module with pre-existing errors must
      # clean that module before it can land. That is the intended cost.
      elp-eqwalize-scope: 'diff'
      # The two quality gates still off, and what each is waiting on:
      #
      # enable-sbom / enable-sbom-scan - `rebar3 sbom` crashes on this repo
      #   with `badarg` in `unicode:characters_to_binary(git)`
      #   (rebar3_sbom_prv:dep_info/4, the root_app clause). src/asobi.app.src
      #   carries `{vsn, git}` - the atom - where kura and shigoto carry
      #   `{vsn, "git"}`, the string, which is why the same plugin works
      #   there. rebar3 accepts either and resolves both from the git tag, so
      #   the unblock is one character in .app.src; that file is off-limits
      #   without a human call, and the plugin should handle the atom anyway
      #   (filed upstream).
      #
      # enable-mutate - needs the rebar3_mutate plugin, and a full-tree
      #   run over 134 modules is far too slow for per-PR CI. Wants
      #   mutate-diff (changed lines only) and a measured baseline first.
      extra-services-compose: 'docker-compose.yml'
      enable-dependency-submission: true
      enable-summary: true
      # erlang-ci restores _build from cache keyed on rebar.lock (with a
      # restore-keys prefix fallback that can resurrect ANY older cache under
      # the same prefix, matching rebar.lock or not), then runs `rebar3 clean`
      # with no `-a` flag - which only wipes the DEFAULT profile's ebin
      # (_build/default/lib/asobi/ebin), never _build/test/lib/asobi/ebin,
      # which is what `rebar3 eunit`/`rebar3 ct` actually compile into and run
      # from. A stale project .beam restored into the test profile survives
      # that clean step untouched, and rebar3's mtime-based incremental
      # compile can decide it's already up to date post-extraction (asobi
      # #287 - two consecutive CI runs crashed on `undefined function
      # asobi_match_server:finished/3` though that export was present in
      # source both times; only a manual cache delete + full rebuild fixed
      # it). Force-fresh both ebin dirs so this can't happen again regardless
      # of what the cache restores.
      #
      # Stale test artifacts copied in by previous runs survive the same
      # default-profile-only clean and get executed by rebar3 eunit/ct.
      # That's how asobi_lua_SUITE.beam (removed in #59) kept reappearing in
      # CT and crashing on `luerl:init/0` undef. Force-fresh project test
      # tree too. meck is a test-only dep (not in rebar.lock) so the cache
      # key never reflects its version; a stale OTP-28-era meck gets restored
      # and fails to compile on OTP 29 (deprecated catch). Drop it so it
      # re-resolves.
      #
      # `rebar3 kura check` rides along on the same hook because erlang-ci has
      # no general escape hatch for an extra step, and the alternative - a
      # bespoke job here - would re-do checkout, setup and compile just to run
      # one command. It diffs the kura_schema modules against src/migrations/
      # and exits non-zero on drift, so editing a schema without generating a
      # migration goes red at PR time instead of surviving to
      # kura_schema_verify at boot. It generates nothing (that's `kura
      # compile`, which writes a wall-clock-named file into src/ and so must
      # never run unattended in CI) and needs no database, only the
      # rebar3_kura project plugin. Runs after the rm above and does not
      # depend on it: the provider compiles the schema and migration sources
      # itself rather than reading asobi's ebin.
      #
      # Trial placement. If this earns its keep, the permanent home is an
      # `enable-kura-check` flag in erlang-ci's prepare-checks matrix, which
      # the other 13 rebar3_kura repos could then opt into with one line. The
      # cost of leaving it here is that it runs once per test job (eunit and
      # ct) rather than once, and that a drift failure is reported under a
      # test job's name - look for the "Pre-test setup" step, not EUnit.
      pre-test-command: 'rm -rf _build/default/lib/asobi/ebin _build/test/lib/asobi/ebin _build/default/lib/asobi/test _build/test/lib/asobi/test _build/test/lib/meck && rebar3 kura check'
      # Non-verbose eunit names a cancelled test as `undefined`, so a timeout
      # (#279) is indistinguishable from a real regression in the log. Verbose
      # names each test and prints its wall time, which also surfaces tests
      # creeping towards the scaled timeout before they start cancelling groups.
      eunit-args: '--verbose'
    secrets: inherit

  # asobi#513. The gateway ships as a release of its own, and what makes that an
  # isolation boundary rather than a claim is the closure it is built with. That
  # cannot be checked by the reusable workflow (it builds no releases) and it
  # cannot be checked by a unit test either, since the property belongs to relx's
  # output rather than to any module. So it is checked here, on every PR, against
  # the artefact a self-hoster actually runs.
  #
  # `-n` is required because this project declares two releases; assembling the
  # engine one as well keeps that spec honest at the same cost.
  gateway-release:
    name: Gateway release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: '.tool-versions'
          version-type: strict

      - name: Assemble both releases
        run: |
          rebar3 as prod release -n asobi
          rebar3 as prod release -n asobi_dgram

      - name: The gateway release carries nothing that holds credentials
        run: |
          libs="$(ls _build/prod/rel/asobi_dgram/lib | sed 's/-[0-9].*//' | sort -u)"
          echo "$libs"
          for heavy in nova kura kura_postgres shigoto luerl nova_auth nova_resilience cowboy ranch; do
            if printf '%s\n' "$libs" | grep -qx "$heavy"; then
              echo "::error::$heavy is in the gateway release; the split has regressed (asobi#513)"
              exit 1
            fi
          done
          for required in asobi_dgram_gw kernel stdlib telemetry; do
            printf '%s\n' "$libs" | grep -qx "$required" || {
              echo "::error::$required is missing from the gateway release"
              exit 1
            }
          done
          test -x _build/prod/rel/asobi_dgram/bin/asobi_dgram
