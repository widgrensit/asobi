name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  # Manual re-run. CI here only triggers on push and pull_request, so when a
  # run is lost - a cancelled job, an Actions incident draining a backlog -
  # there is no way to ask for another against main without pushing to it,
  # which the PR-only workflow forbids. During the 2026-08-06 Actions outage
  # main sat with no completed CI run for hours for exactly this reason.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.1.7
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      # version-file drives the analysis jobs; the eunit/ct matrix uses
      # otp-matrix (else it falls back to the otp-version default of 28).
      otp-matrix: '["29.0.2"]'
      enable-audit: true
      enable-ct: true
      enable-coverage: true
      enable-elp-lint: true
      # The three quality gates still off, and what each is waiting on:
      #
      # enable-sbom / enable-sbom-scan - `rebar3 sbom` crashes on this repo
      #   with `badarg` in `unicode:characters_to_binary(git)`
      #   (rebar3_sbom_prv:dep_info/4, the root_app clause). src/asobi.app.src
      #   carries `{vsn, git}` - the atom - where kura and shigoto carry
      #   `{vsn, "git"}`, the string, which is why the same plugin works
      #   there. rebar3 accepts either and resolves both from the git tag, so
      #   the unblock is one character in .app.src; that file is off-limits
      #   without a human call, and the plugin should handle the atom anyway
      #   (filed upstream).
      #
      # enable-elp-eqwalize - 312 eqwalizer errors on this tree (asobi#435),
      #   so the job would fail on merge day. 310 of them are
      #   `incompatible_types`, and 172 of those are a `term()` - out of
      #   `maps:get/2`, `persistent_term:get/1`, ETS, or Luerl's `dynamic()` -
      #   reaching a typed context with no narrowing clause. Weighted to
      #   test/ (127) but present across src/console, src/lua, src/world and
      #   src/ops. Cleaning it is a real project, tracked in the issue; the
      #   tooling to run it is in place now, so it can go on per-area as the
      #   count comes down.
      #
      #   Two reasons previously recorded here were wrong and cost time twice
      #   over, so for the record: eqwalizer does NOT panic on OTP 29 (that
      #   theory was superseded - the root cause was the `record()` builtin,
      #   since fixed), and ELP does not need to run on 28.x. The real blocker
      #   for both ELP jobs was that Taure/erlang-ci's elp action mapped OTP
      #   majors to hardcoded asset names and stopped at 28, so on OTP 29 it
      #   failed before downloading ELP at all. Fixed across erlang-ci#71, #72
      #   and #73 (v2.1.7), which also moved its compile step to
      #   `rebar3 as test compile` so test-profile parse transforms resolve.
      #
      # enable-mutate - needs the rebar3_mutate plugin, and a full-tree
      #   run over 134 modules is far too slow for per-PR CI. Wants
      #   mutate-diff (changed lines only) and a measured baseline first.
      extra-services-compose: 'docker-compose.yml'
      enable-dependency-submission: true
      enable-summary: true
      # erlang-ci restores _build from cache keyed on rebar.lock (with a
      # restore-keys prefix fallback that can resurrect ANY older cache under
      # the same prefix, matching rebar.lock or not), then runs `rebar3 clean`
      # with no `-a` flag - which only wipes the DEFAULT profile's ebin
      # (_build/default/lib/asobi/ebin), never _build/test/lib/asobi/ebin,
      # which is what `rebar3 eunit`/`rebar3 ct` actually compile into and run
      # from. A stale project .beam restored into the test profile survives
      # that clean step untouched, and rebar3's mtime-based incremental
      # compile can decide it's already up to date post-extraction (asobi
      # #287 - two consecutive CI runs crashed on `undefined function
      # asobi_match_server:finished/3` though that export was present in
      # source both times; only a manual cache delete + full rebuild fixed
      # it). Force-fresh both ebin dirs so this can't happen again regardless
      # of what the cache restores.
      #
      # Stale test artifacts copied in by previous runs survive the same
      # default-profile-only clean and get executed by rebar3 eunit/ct.
      # That's how asobi_lua_SUITE.beam (removed in #59) kept reappearing in
      # CT and crashing on `luerl:init/0` undef. Force-fresh project test
      # tree too. meck is a test-only dep (not in rebar.lock) so the cache
      # key never reflects its version; a stale OTP-28-era meck gets restored
      # and fails to compile on OTP 29 (deprecated catch). Drop it so it
      # re-resolves.
      pre-test-command: 'rm -rf _build/default/lib/asobi/ebin _build/test/lib/asobi/ebin _build/default/lib/asobi/test _build/test/lib/asobi/test _build/test/lib/meck'
      # Non-verbose eunit names a cancelled test as `undefined`, so a timeout
      # (#279) is indistinguishable from a real regression in the log. Verbose
      # names each test and prints its wall time, which also surfaces tests
      # creeping towards the scaled timeout before they start cancelling groups.
      eunit-args: '--verbose'
    secrets: inherit
