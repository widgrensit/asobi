name: Docker publish (gateway)

# Publishes ghcr.io/widgrensit/asobi-dgram - the datagram gateway, and only that.
#
# The engine image is NOT built here. It comes from the asobi_bundle
# meta-package, because it has to carry the full closure of first-party
# extensions and building it from this repo's bare release would silently drop
# one on upgrade (#471). The gateway has the opposite problem: it must carry
# nothing. Its release is `[asobi_dgram_gw, sasl]` - no nova, no kura, no
# shigoto, no Lua, no extensions - so a bundle would defeat it, and this
# repository is the only place that defines what belongs in it.
#
# What makes that a boundary rather than a claim is the guard job below: the
# image is pushed only if its lib directory is what it is supposed to be.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-dgram
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Loaded locally first so the closure can be inspected before anything is
      # pushed. A gateway image that acquired a database driver is not something
      # to publish and then notice.
      - name: Build the gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: gateway
          load: true
          push: false
          tags: asobi-dgram:guard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: The image carries nothing that holds credentials
        run: |
          libs="$(docker run --rm --entrypoint sh asobi-dgram:guard -c 'ls /app/lib' | sed 's/-[0-9].*//' | sort -u)"
          echo "$libs"
          for heavy in nova kura kura_postgres shigoto luerl nova_auth nova_resilience cowboy ranch; do
            if printf '%s\n' "$libs" | grep -qx "$heavy"; then
              echo "::error::$heavy is in the gateway image; the release split has regressed (asobi#513)"
              exit 1
            fi
          done
          for required in asobi_dgram_gw kernel stdlib telemetry; do
            printf '%s\n' "$libs" | grep -qx "$required" || {
              echo "::error::$required is missing from the gateway image"
              exit 1
            }
          done

      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
